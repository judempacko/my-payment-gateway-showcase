name: payment-gateway-showcase

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: pay
      POSTGRES_PASSWORD: pay
      POSTGRES_DB: payments
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pay -d payments']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: sh -c 'node dist/infra/db/migrate.js && node dist/infra/db/seed.js'
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://pay:pay@postgres:5432/payments
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3001
      API_PREFIX: api/v1
      DATABASE_URL: postgresql://pay:pay@postgres:5432/payments
      REDIS_URL: redis://redis:6379
      CORS_ORIGIN: http://localhost:4310
      WEB_URL: http://localhost:4310
      DEMO_API_KEY: demo_sk_local
      MOCK_WEBHOOK_SECRET: whsec_mock_local_secret
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      PAWAPAY_API_TOKEN: ${PAWAPAY_API_TOKEN:-}
      PAWAPAY_BASE_URL: ${PAWAPAY_BASE_URL:-https://api.sandbox.pawapay.io}
      PAWAPAY_DEFAULT_COUNTRY: ${PAWAPAY_DEFAULT_COUNTRY:-SN}
      PAWAPAY_PROVIDER: ${PAWAPAY_PROVIDER:-}
      PAWAPAY_PUBLIC_KEY: ${PAWAPAY_PUBLIC_KEY:-}
      PAWAPAY_ALLOW_UNSIGNED_CALLBACKS: ${PAWAPAY_ALLOW_UNSIGNED_CALLBACKS:-false}
    ports:
      - '3001:3001'
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3001/api/v1/health/live >/dev/null || exit 1']
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: node dist/worker.js
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://pay:pay@postgres:5432/payments
      REDIS_URL: redis://redis:6379
      MOCK_WEBHOOK_SECRET: whsec_mock_local_secret
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      PAWAPAY_API_TOKEN: ${PAWAPAY_API_TOKEN:-}
      PAWAPAY_BASE_URL: ${PAWAPAY_BASE_URL:-https://api.sandbox.pawapay.io}
      PAWAPAY_DEFAULT_COUNTRY: ${PAWAPAY_DEFAULT_COUNTRY:-SN}
      PAWAPAY_PROVIDER: ${PAWAPAY_PROVIDER:-}
      PAWAPAY_PUBLIC_KEY: ${PAWAPAY_PUBLIC_KEY:-}
      PAWAPAY_ALLOW_UNSIGNED_CALLBACKS: ${PAWAPAY_ALLOW_UNSIGNED_CALLBACKS:-false}
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3001/api/v1
        NEXT_PUBLIC_DEMO_API_KEY: demo_sk_local
    environment:
      NODE_ENV: production
      PORT: 4310
      API_INTERNAL_URL: http://api:3001/api/v1
    ports:
      - '4310:4310'
    depends_on:
      api:
        condition: service_started

volumes:
  postgres-data:
  redis-data:
